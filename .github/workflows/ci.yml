name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tasamuh-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/tasamuh-http.log
              exit 1
            fi
            sleep 1
          done

          node tests/smoke.mjs

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test-results
          if [ -f /tmp/tasamuh-http.log ]; then
            cp /tmp/tasamuh-http.log test-results/server.log
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: test-results/
          if-no-files-found: ignore
